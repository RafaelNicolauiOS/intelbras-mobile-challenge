# Xcode project definition. Regenerate with: cd iosApp && xcodegen generate
name: iosApp
options:
  bundleIdPrefix: dev.rafaelnicolau
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig
settings:
  base:
    # Swift 6: data-race safety is checked at compile time. Everything that updates a view or
    # handles a text field is @MainActor, and the compiler rejects any code that breaks that.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Dispositivos
        UILaunchScreen: {}
        UIAppFonts:
          - OpenSans-Variable.ttf
        API_BASE_URL: $(API_BASE_URL)
        API_TOKEN: $(API_TOKEN)
        NSAppTransportSecurity:
          NSExceptionDomains:
            squadapps.ddns-intelbras.com.br:
              NSExceptionAllowsInsecureHTTPLoads: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rafaelnicolau.devices
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Build Kotlin shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  # Unit tests for the Swift layer (texts, theme, observables, coordinators, view controllers
  # and views). Hosted by the app, so the Kotlin framework linked into it is shared, not duplicated.
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - iosAppTests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rafaelnicolau.devices.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Only to `import Shared`; its symbols come from the host app (no second Kotlin runtime).
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
# A shared scheme, so a fresh clone (and CI) can build without opening Xcode first.
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - iosAppTests
